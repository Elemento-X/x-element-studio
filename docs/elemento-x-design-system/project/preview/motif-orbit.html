<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.cell { flex:1; display:flex; flex-direction:column; gap:10px; align-items:center; padding:18px 12px; background:#0D0D0F; border:1px solid rgba(234,234,234,0.08); border-radius:6px; }
.cell .label { font-size:10px; letter-spacing:0.24em; text-transform:uppercase; color:#EAEAEA; }
.cell .sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:#6A6A6F; text-align:center; line-height:1.5; }
.motif { width:60px; height:60px; color:#F5C21A; }
.element-chip { width:64px; height:64px; background:#F5C21A; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.element-chip img { width:52px; height:52px; }
</style></head>
<body>
<div class="col" style="gap:12px">
  <div class="eyebrow">Brand motifs · precision · symbolic · flat</div>
  <div class="row" style="gap:10px;align-items:stretch">
    <div class="cell">
      <div class="element-chip"><img src="../assets/element-mark.png"/></div>
      <div class="label">Element</div>
      <div class="sub">the hidden<br>mark</div>
    </div>
    <div class="cell">
      <img class="motif" src="../assets/icon-orbit.svg"/>
      <div class="label">Orbit</div>
      <div class="sub">automation<br>loops</div>
    </div>
    <div class="cell">
      <img class="motif" src="../assets/icon-target.svg"/>
      <div class="label">Zero point</div>
      <div class="sub">decision<br>focus</div>
    </div>
    <div class="cell">
      <img class="motif" src="../assets/icon-layers.svg"/>
      <div class="label">Layers</div>
      <div class="sub">system<br>synergy</div>
    </div>
  </div>
</div>
</body></html>
