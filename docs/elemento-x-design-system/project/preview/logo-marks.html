<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:14px">
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <div class="eyebrow">Logo · primary mark</div>
    <div class="mono" style="color:var(--fg-3)">F5C21A · 0D0D0F</div>
  </div>
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="width:150px;height:150px;background:#F5C21A;border-radius:6px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logo-mark.png" style="width:118px;height:118px;display:block"/>
    </div>
    <div style="flex:1;background:#0D0D0F;border:1px solid rgba(234,234,234,0.06);border-radius:6px;display:flex;align-items:center;gap:18px;padding:16px 22px">

        <img src="../assets/logo-mark.png" style="width:60px;height:60px;display:block"/>
      </div>
      <div class="col" style="gap:4px">
        <div style="font-family:'Exo 2',sans-serif;font-weight:600;font-size:24px;color:#EAEAEA;letter-spacing:0.14em">ELEMENTO-X</div>
        <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:8.5px;color:#6A6A6F;letter-spacing:0.32em;text-transform:uppercase">Sistemas inteligentes. Impacto real.</div>
      </div>
    </div>
  </div>
  <div class="mono" style="color:var(--fg-3);font-size:11px">Flat. No effects. No distortion. Minimum 24px. One per surface.</div>
</div>
</body></html>
