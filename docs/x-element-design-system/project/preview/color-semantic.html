<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:12px">
  <div class="eyebrow">Semantic Tokens</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--bg-canvas)"></div><div class="col" style="gap:2px"><div class="label fg-1">--bg-canvas</div><div class="mono">#0D0D0F</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--bg-panel)"></div><div class="col" style="gap:2px"><div class="label fg-1">--bg-panel</div><div class="mono">#111114</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--bg-raised)"></div><div class="col" style="gap:2px"><div class="label fg-1">--bg-raised</div><div class="mono">#1A1A1E</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--fg-1)"></div><div class="col" style="gap:2px"><div class="label fg-1">--fg-1</div><div class="mono">#EAEAEA</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:#B8B8BD"></div><div class="col" style="gap:2px"><div class="label fg-1">--fg-2</div><div class="mono">#B8B8BD</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--fg-3)"></div><div class="col" style="gap:2px"><div class="label fg-1">--fg-3</div><div class="mono">#6A6A6F</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:var(--fg-signal)"></div><div class="col" style="gap:2px"><div class="label fg-1">--fg-signal</div><div class="mono">#F5C21A</div></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="width:40px;height:40px;background:transparent;border-color:var(--line-gold)"></div><div class="col" style="gap:2px"><div class="label fg-1">--line-gold</div><div class="mono">rgba(245,194,26,.45)</div></div></div>
  </div>
</div>
</body></html>
