<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
.ico { stroke-width: 1.5; color: var(--fg-2); }
.ico-slot { display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:#111114;border:1px solid rgba(234,234,234,0.06);border-radius:6px }
.ico-active { color: #F5C21A; border-color: rgba(245,194,26,0.45) }
</style></head>
<body>
<div class="col" style="gap:12px">
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <div class="eyebrow">Product UI icons · Lucide (CDN)</div>
    <div class="mono">1.5px stroke · 16/20/24</div>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <div class="ico-slot"><i data-lucide="activity" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="radio" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="layers" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="crosshair" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="zap" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="shield" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="terminal" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="database" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="cpu" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="workflow" class="ico"></i></div>
    <div class="ico-slot ico-active"><i data-lucide="target" class="ico"></i></div>
    <div class="ico-slot"><i data-lucide="chevron-right" class="ico"></i></div>
  </div>
  <div class="mono" style="color:var(--fg-3)">Default fg-2 · Hover fg-1 · Active gold. Never filled. Never emoji.</div>
</div>
<script>lucide.createIcons();</script>
</body></html>
