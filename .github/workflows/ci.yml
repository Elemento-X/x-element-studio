name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Weekly proactive scan — catches advisories published after merge that
  # Dependabot might not have raised a PR for yet.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx next build

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (unit + integration)
        run: npm run test:run

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality-gate
    # Visual baselines are platform-sensitive (glibc / pango / fontconfig
    # versions change font hinting and accumulate sub-pixel drift across a
    # full-page screenshot). Pinning the runner to the same Playwright
    # container used to regenerate baselines keeps the comparison
    # deterministic. Bump this tag in lockstep with @playwright/test in
    # package.json — they must always match.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # webServer in playwright.config.ts builds + starts the production
      # server in CI (avoids Turbopack dev-server stale manifests).
      #
      # Playwright browsers + OS deps ship pre-installed in the container,
      # so we skip `npx playwright install --with-deps` — running it again
      # would re-download identical binaries on every run.
      #
      # PW_SKIP_CONTACT_FORM=1: the contact-form golden-path spec requires
      # a live /api/contact (which validates real envs at runtime — Resend,
      # Notion, Upstash). In CI we don't ship those secrets to the runner
      # (and shouldn't: it would expose them in deployment logs). Skip the
      # spec there; it runs locally with .env.local and against the deploy
      # preview via smoke-test-prod.sh.
      - name: Run E2E tests
        env:
          PW_SKIP_CONTACT_FORM: '1'
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality-gate

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # security.md requires high+ to block deploy. critical alone lets
        # high CVEs through (e.g. SSRF, RCE marked HIGH not CRITICAL).
        run: npm audit --audit-level=high
