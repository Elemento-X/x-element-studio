<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:14px">
  <div class="eyebrow">Inter · brand typeface · optical sizes</div>
  <div class="row" style="gap:16px;align-items:flex-end">
    <div class="col" style="gap:4px;flex:1">
      <div class="mono">18pt · ≤ 20px</div>
      <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:18px;color:var(--fg-1)">Inter 18pt Medium</div>
      <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:13px;color:var(--fg-2)">Body · small UI</div>
    </div>
    <div class="col" style="gap:4px;flex:1">
      <div class="mono">24pt · 20–32px</div>
      <div style="font-family:'Inter Display',sans-serif;font-weight:600;font-size:22px;color:var(--fg-1)">Inter Display 24pt</div>
      <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:13px;color:var(--fg-2)">Callouts · mid-heads</div>
    </div>
    <div class="col" style="gap:4px;flex:1.1">
      <div class="mono">28pt · 32px+</div>
      <div style="font-family:'Inter Headline',sans-serif;font-weight:700;font-size:26px;color:var(--fg-1);letter-spacing:-0.01em">Inter Headline</div>
      <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:13px;color:var(--fg-2)">Large headlines</div>
    </div>
  </div>
  <div class="row" style="gap:10px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line-hairline)">
    <span style="font-family:'Inter';font-weight:300;color:var(--fg-3);font-size:14px">Light 300</span>
    <span style="font-family:'Inter';font-weight:400;color:var(--fg-2);font-size:14px">Regular 400</span>
    <span style="font-family:'Inter';font-weight:500;color:var(--fg-1);font-size:14px">Medium 500</span>
    <span style="font-family:'Inter';font-weight:600;color:var(--fg-1);font-size:14px">SemiBold 600</span>
    <span style="font-family:'Inter';font-weight:700;color:var(--fg-1);font-size:14px">Bold 700</span>
    <span style="font-family:'Inter';font-weight:800;color:var(--fg-1);font-size:14px">ExtraBold 800</span>
  </div>
</div>
</body></html>
