<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:14px">

      <div class="mono">#F5C21A</div>
    </div>
    <div class="col" style="flex:1">
      <div class="swatch" style="height:96px;background:#C89E14"></div>
      <div class="label">Gold Dim · hover</div>
      <div class="mono">#C89E14</div>
    </div>
    <div class="col" style="flex:1">
      <div class="swatch" style="height:96px;background:#6E5B00"></div>
      <div class="label">Gold Deep · halo</div>
      <div class="mono">#6E5B00</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--fg-3);letter-spacing:0.02em;margin-top:2px">Gold is never a background. It is intentional emphasis — one per viewport.</div>
</div>
