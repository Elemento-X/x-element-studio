<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 22px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; transition: all 150ms cubic-bezier(0.2,0.8,0.2,1); display: inline-flex; align-items: center; gap: 10px; }
.btn-primary { background: #F5C21A; color: #0D0D0F; }
.btn-primary:hover { background: #C89E14; }
.btn-primary.pressed { background: #A88210; }
.btn-primary.focus { background: #F5C21A; box-shadow: 0 0 0 3px rgba(245,194,26,0.25), 0 0 24px rgba(245,194,26,0.18); }
.btn-primary.disabled { background: #2B2B2E; color: #6A6A6F; cursor: not-allowed; }
.arrow { width:12px; height:12px; }
</style></head>
<body>
<div class="col" style="gap:14px">
  <div class="eyebrow">Button · Primary (the one gold CTA)</div>
  <div class="row" style="gap:12px;flex-wrap:wrap">
    <button class="btn btn-primary">Execute<svg class="arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6h8M7 3l3 3-3 3"/></svg></button>
    <button class="btn btn-primary" style="background:#C89E14">Hover</button>
    <button class="btn btn-primary pressed">Pressed</button>
    <button class="btn btn-primary focus">Focused</button>
    <button class="btn btn-primary disabled">Disabled</button>
  </div>
  <div class="mono" style="color:var(--fg-3)">One per viewport. Never two gold CTAs on the same surface.</div>
</div>
</body></html>
